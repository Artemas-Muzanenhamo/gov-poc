spring:
  main:
    banner-mode: console
  banner:
    location: classpath:banner.txt
    charset: utf-8

---

spring:
  config:
    activate:
      on-profile: docker
  data:
    mongodb:
      host: host.docker.internal
      port: 27017
      database: identity-service-db
server:
  port: 8080
eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka

---

spring:
  config:
    activate:
      on-profile: dev
  data:
    mongodb:
      host: localhost
      port: 27017
      database: identity-service-db
server:
  port: 8080
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
