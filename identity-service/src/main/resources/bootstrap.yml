spring:
  config:
    activate:
      on-profile:
        - docker
  application:
    name: identity-service
  cloud:
    config:
      uri: http://configuration-server:8888
      fail-fast: true
  data:
    rest:
      base-path: /search-id

---

spring:
  config:
    activate:
      on-profile: dev
  application:
    name: identity-service
  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: true
  data:
    rest:
      base-path: /search-id
