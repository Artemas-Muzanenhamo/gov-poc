spring:
  main:
    banner-mode: console
  banner:
    location: classpath:banner.txt
    charset: utf-8
---

spring:
  application:
    name: license-service
  cloud:
    config:
      uri: http://configuration-server:8888
      fail-fast: true
  config:
    activate:
      on-profile: docker

---

spring:
  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: true
  config:
    activate:
      on-profile: dev
